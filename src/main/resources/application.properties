# Use pontos para bater com o @Value("${strava.client.id}")
strava.webhook.verify-token=${STRAVA_WEBHOOK_VERIFY_TOKEN}
strava.client.id=${STRAVA_CLIENT_ID}
strava.client.secret=${STRAVA_CLIENT_SECRET}
strava.access.token=${STRAVA_ACCESS_TOKEN}
strava.refresh.token=${STRAVA_REFRESH_TOKEN}

# Perfil do Atleta para C\u00E1lculo de Karvonen
# Parametros de Frequencia Cardiaca do Atleta (Zonas de Karvonen)
atleta.hr-max=173
atleta.hr-resting=50

# Configura\u00E7\u00E3o MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:stravafit}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&connectTimeout=5000&socketTimeout=30000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# Configura\u00E7\u00F5es de Pool (Hikari) para estabilidade aut\u00F4noma
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=300000

# Codifica\u00E7\u00E3o UTF-8 para Web e Mensagens
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.properties.hibernate.connection.autocommit=true

# O Hibernate 6 detecta o Dialeto automaticamente, removido para evitar avisos de deprecacao

# Configura\u00E7\u00F5es extras do Spring (\u00FAtil para debug)
logging.level.jackson.stravafit=${LOG_LEVEL:INFO}

# Log detalhado para diagn\u00F3sticos de integra\u00E7\u00E3o (Apenas para o teste)
logging.level.org.springframework.web.client.RestClient=WARN

# Configura\u00E7\u00F5es/Conex\u00E3o REST/ API GEMINI
gemini.api.key=${GEMINI_API_KEY}
gemini.models.list=gemini-2.5-flash,gemini-1.5-flash-latest,gemini-2.5-pro,gemini-1.5-pro-latest
# Configura\u00E7\u00F5es Telegram (Seguro via Vari\u00E1veis de Ambiente)
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.chat.id=${TELEGRAM_CHAT_ID}
