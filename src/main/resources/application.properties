# Use pontos para bater com o @Value("${strava.client.id}")
strava.client.id=${STRAVA_CLIENT_ID}
strava.client.secret=${STRAVA_CLIENT_SECRET}
strava.access.token=${STRAVA_ACCESS_TOKEN}
strava.refresh.token=${STRAVA_REFRESH_TOKEN}

# Perfil do Atleta para Cálculo de Karvonen
atleta.hr-max=173
atleta.hr-resting=53

# Configuração MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:stravafit}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Configurações extras do Spring (útil para debug)
logging.level.jackson.stravafit=DEBUG

# Configurações/Conexão REST/ API GEMINI
gemini.api.key=${GEMINI_API_KEY}

# Configurações Telegram (Seguro via Variáveis de Ambiente)
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.chat.id=${TELEGRAM_CHAT_ID}
